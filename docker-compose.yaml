services:
  proxy:
    build: .
    image: claude-deepseek-proxy:latest
    container_name: claude-deepseek-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - LISTEN_ADDR=0.0.0.0:8082
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?err}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CLIENT_TIMEOUT=${CLIENT_TIMEOUT:-120s}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
